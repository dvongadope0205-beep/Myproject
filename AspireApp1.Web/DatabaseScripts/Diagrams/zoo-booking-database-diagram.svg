    <text class="field" x="888" y="254">FK user_id</text>
    <text class="field" x="888" y="272">session_token, status</text>
    <text class="field-muted" x="888" y="290">expires_at</text>

    <rect class="table" x="1070" y="190" width="180" height="138"/>
    <rect class="table thead-order" x="1070" y="190" width="180" height="30"/>
    <text class="table-name" x="1088" y="210">cart_items</text>
    <text class="field" x="1088" y="236">PK id</text>
    <text class="field" x="1088" y="254">FK cart_id, product_id</text>
    <text class="field" x="1088" y="272">FK product_variant_id</text>
    <text class="field" x="1088" y="290">FK activity_session_id</text>
    <text class="field-muted" x="1088" y="308">quantity, unit_price</text>

    <rect class="table" x="870" y="358" width="180" height="126"/>
