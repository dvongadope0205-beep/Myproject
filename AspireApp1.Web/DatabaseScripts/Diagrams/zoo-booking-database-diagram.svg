<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1360" viewBox="0 0 1800 1360" role="img" aria-labelledby="title desc">
  <title id="title">Zoo Booking Database Diagram</title>
  <desc id="desc">Module-oriented SVG database diagram for the zoo ticketing, activities, membership, shop, donation, and checkout platform.</desc>
  <defs>
    <style>
      .bg { fill: #fcfbf7; }
      .panel { rx: 26; ry: 26; stroke-width: 2; }
      .panel-title { font: 700 20px 'Segoe UI', Arial, sans-serif; fill: #17313b; }
      .panel-subtitle { font: 400 12px 'Segoe UI', Arial, sans-serif; fill: #5b6b73; }
      .table { fill: #ffffff; stroke: #304a57; stroke-width: 1.4; rx: 14; ry: 14; }
      .thead { fill: #e7eff3; }
      .thead-catalog { fill: #e4f5ea; }
      .thead-order { fill: #fff0d6; }
      .thead-payment { fill: #fce5e7; }
      .thead-engage { fill: #efe8fb; }
      .table-name { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #17313b; }
      .field { font: 400 11px 'Consolas', 'Courier New', monospace; fill: #304a57; }
      .field-muted { font: 400 11px 'Consolas', 'Courier New', monospace; fill: #5c6b73; }
      .line-main { stroke: #5b6b73; stroke-width: 2; fill: none; }
      .line-soft { stroke: #90a0aa; stroke-width: 1.6; fill: none; }
      .line-dash { stroke: #90a0aa; stroke-width: 1.4; stroke-dasharray: 7 5; fill: none; }
      .caption { font: 600 26px 'Segoe UI', Arial, sans-serif; fill: #17313b; }
      .note { font: 400 13px 'Segoe UI', Arial, sans-serif; fill: #5b6b73; }
      .label { font: 600 11px 'Segoe UI', Arial, sans-serif; fill: #4e5d66; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1800" height="1360" />
  <text class="caption" x="60" y="54">Zoo Platform Database Diagram</text>
  <text class="note" x="60" y="80">Core data model for booking, membership, commerce, payment, check-in, and engagement flows.</text>

  <rect class="panel" x="40" y="110" width="320" height="1140" fill="#eef4f7" stroke="#90a7b2" />
  <text class="panel-title" x="64" y="145">Identity &amp; CRM</text>
  <text class="panel-subtitle" x="64" y="164">Accounts, member lifecycle, outreach, special requests</text>

  <rect class="panel" x="390" y="110" width="430" height="1140" fill="#eef8f0" stroke="#9ab9a2" />
  <text class="panel-title" x="414" y="145">Catalog &amp; Scheduling</text>
  <text class="panel-subtitle" x="414" y="164">Products, activities, session availability</text>

  <rect class="panel" x="850" y="110" width="420" height="1140" fill="#fff8ec" stroke="#d7bd7f" />
  <text class="panel-title" x="874" y="145">Cart &amp; Order Flow</text>
  <text class="panel-subtitle" x="874" y="164">Selection, reservation hold, order capture</text>

  <rect class="panel" x="1300" y="110" width="460" height="1140" fill="#fff5f5" stroke="#d2a3a8" />
  <text class="panel-title" x="1324" y="145">Payment, Fulfillment &amp; Operations</text>
  <text class="panel-subtitle" x="1324" y="164">Billing, ticket issuance, shipping, campaigns</text>

  <g id="identity">
    <rect class="table" x="60" y="190" width="280" height="138"/>
    <rect class="table thead" x="60" y="190" width="280" height="34"/>
    <text class="table-name" x="78" y="212">users</text>
    <text class="field" x="78" y="244">PK  id : bigint</text>
    <text class="field" x="78" y="262">email : varchar</text>
    <text class="field" x="78" y="280">full_name : varchar</text>
    <text class="field" x="78" y="298">phone : varchar</text>
    <text class="field-muted" x="78" y="316">status, created_at, updated_at</text>

    <rect class="table" x="60" y="354" width="130" height="118"/>
    <rect class="table thead" x="60" y="354" width="130" height="30"/>
    <text class="table-name" x="74" y="374">member_plans</text>
    <text class="field" x="74" y="398">PK id</text>
    <text class="field" x="74" y="416">name</text>
    <text class="field" x="74" y="434">duration_days</text>
    <text class="field" x="74" y="452">price</text>

    <rect class="table" x="210" y="354" width="130" height="118"/>
    <rect class="table thead" x="210" y="354" width="130" height="30"/>
    <text class="table-name" x="224" y="374">memberships</text>
    <text class="field" x="224" y="398">PK id</text>
    <text class="field" x="224" y="416">FK user_id</text>
    <text class="field" x="224" y="434">FK member_plan_id</text>
    <text class="field-muted" x="224" y="452">date range, status</text>

    <rect class="table" x="60" y="500" width="280" height="118"/>
    <rect class="table thead" x="60" y="500" width="280" height="30"/>
    <text class="table-name" x="78" y="520">addresses</text>
    <text class="field" x="78" y="544">PK id</text>
    <text class="field" x="78" y="562">FK user_id</text>
    <text class="field" x="78" y="580">line1, city, province</text>
    <text class="field-muted" x="78" y="598">postal_code, country, type</text>

    <rect class="table" x="60" y="646" width="280" height="132"/>
    <rect class="table thead" x="60" y="646" width="280" height="30"/>
    <text class="table-name" x="78" y="666">private_event_requests</text>
    <text class="field" x="78" y="690">PK id</text>
    <text class="field" x="78" y="708">FK user_id</text>
    <text class="field" x="78" y="726">event_date, guest_count</text>
    <text class="field-muted" x="78" y="744">quoted_price, status, approved_by</text>

    <rect class="table" x="60" y="806" width="280" height="118"/>
    <rect class="table thead" x="60" y="806" width="280" height="30"/>
    <text class="table-name" x="78" y="826">notifications</text>
    <text class="field" x="78" y="850">PK id</text>
    <text class="field" x="78" y="868">FK user_id</text>
    <text class="field" x="78" y="886">channel, template_code</text>
    <text class="field-muted" x="78" y="904">payload_json, status, sent_at</text>

    <rect class="table" x="60" y="952" width="280" height="118"/>
    <rect class="table thead" x="60" y="952" width="280" height="30"/>
    <text class="table-name" x="78" y="972">coupon_redemptions</text>
    <text class="field" x="78" y="996">PK id</text>
    <text class="field" x="78" y="1014">FK promotion_id</text>
    <text class="field" x="78" y="1032">FK user_id, FK order_id</text>
    <text class="field-muted" x="78" y="1050">redeemed_at</text>
  </g>

  <g id="catalog">
    <rect class="table" x="410" y="190" width="190" height="110"/>
    <rect class="table thead-catalog" x="410" y="190" width="190" height="30"/>
    <text class="table-name" x="428" y="210">product_categories</text>
    <text class="field" x="428" y="236">PK id</text>
    <text class="field" x="428" y="254">code</text>
    <text class="field" x="428" y="272">name</text>

    <rect class="table" x="620" y="190" width="180" height="138"/>
    <rect class="table thead-catalog" x="620" y="190" width="180" height="30"/>
    <text class="table-name" x="638" y="210">products</text>
    <text class="field" x="638" y="236">PK id</text>
    <text class="field" x="638" y="254">FK category_id</text>
    <text class="field" x="638" y="272">name, base_price</text>
    <text class="field-muted" x="638" y="290">requires_date, status</text>
    <text class="field-muted" x="638" y="308">shipping, approval flags</text>

    <rect class="table" x="410" y="332" width="190" height="118"/>
