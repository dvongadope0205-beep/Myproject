    <text class="table-name" x="888" y="378">inventory_holds</text>
    <text class="field" x="888" y="404">PK id</text>
    <text class="field" x="888" y="422">FK cart_id, user_id</text>
    <text class="field" x="888" y="440">hold_code, status</text>
    <text class="field-muted" x="888" y="458">expires_at</text>

    <rect class="table" x="1070" y="358" width="180" height="110"/>
    <rect class="table thead-order" x="1070" y="358" width="180" height="30"/>
    <text class="table-name" x="1088" y="378">inventory_hold_items</text>
    <text class="field" x="1088" y="404">PK id</text>
    <text class="field" x="1088" y="422">FK hold_id</text>
    <text class="field" x="1088" y="440">FK activity_session_id</text>
    <text class="field-muted" x="1088" y="458">quantity</text>

    <rect class="table" x="870" y="536" width="180" height="138"/>
    <rect class="table thead-order" x="870" y="536" width="180" height="30"/>
    <text class="table-name" x="888" y="556">orders</text>
    <text class="field" x="888" y="582">PK id</text>
    <text class="field" x="888" y="600">order_no</text>
    <text class="field" x="888" y="618">FK user_id, status</text>
    <text class="field" x="888" y="636">totals: subtotal..grand_total</text>
    <text class="field-muted" x="888" y="654">created_at, updated_at</text>

    <rect class="table" x="1070" y="536" width="180" height="138"/>
    <rect class="table thead-order" x="1070" y="536" width="180" height="30"/>
    <text class="table-name" x="1088" y="556">order_items</text>
    <text class="field" x="1088" y="582">PK id</text>
    <text class="field" x="1088" y="600">FK order_id, product_id</text>
    <text class="field" x="1088" y="618">FK product_variant_id</text>
    <text class="field" x="1088" y="636">FK activity_session_id</text>
    <text class="field-muted" x="1088" y="654">qty, line_total, meta_json</text>
  </g>

  <g id="ops">
