    <text class="table-name" x="428" y="352">product_variants</text>
    <text class="field" x="428" y="378">PK id</text>
    <text class="field" x="428" y="396">FK product_id</text>
    <text class="field" x="428" y="414">sku, price</text>
    <text class="field-muted" x="428" y="432">stock_qty, attributes_json</text>

    <rect class="table" x="620" y="356" width="180" height="110"/>
    <rect class="table thead-catalog" x="620" y="356" width="180" height="30"/>
    <text class="table-name" x="638" y="376">activities</text>
    <text class="field" x="638" y="402">PK id</text>
    <text class="field" x="638" y="420">FK product_id</text>
    <text class="field-muted" x="638" y="438">location, duration, age rules</text>

    <rect class="table" x="410" y="492" width="390" height="138"/>
    <rect class="table thead-catalog" x="410" y="492" width="390" height="30"/>
    <text class="table-name" x="428" y="512">activity_sessions</text>
    <text class="field" x="428" y="538">PK id</text>
    <text class="field" x="428" y="556">FK activity_id</text>
    <text class="field" x="428" y="574">session_date, start_time, end_time</text>
    <text class="field" x="428" y="592">capacity, reserved_qty, sold_qty</text>
    <text class="field-muted" x="428" y="610">status, created_at</text>
  </g>

  <g id="orderflow">
    <rect class="table" x="870" y="190" width="180" height="118"/>
    <rect class="table thead-order" x="870" y="190" width="180" height="30"/>
